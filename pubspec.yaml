name: timma_kds
description: >-
  The TIMMA kitchen display. A tablet in the kitchen that keeps showing and advancing tickets with the WAN unplugged, driven by the kiosk hub over the restaurant LAN (ECOSYSTEM §23).
publish_to: 'none'
version: 0.6.2+13

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^3.3.2
  path_provider: ^2.1.5
  # Named because this repo's own code imports them directly.
  crypto: ^3.0.7
  timezone: ^0.10.0

  # The alarm's voice. A kitchen board that shows a new ticket silently is a
  # board nobody reads until the customer asks — the ring is the whole point of
  # a screen mounted above a hot line (ECOSYSTEM §22.1).
  #
  # Chosen over a system-sound call because iOS's silent switch mutes those, and
  # a kitchen tablet lives face-up on a shelf with its switch in whatever
  # position the last person left it. `AVAudioSessionCategory.playback` is what
  # makes the alarm survive that switch, and only a real audio session offers it.
  audioplayers: ^6.8.1

  # The offline engine and the transports, PINNED to a commit.
  #
  # They live in timmaeat-app-flutter — the schema owner — deliberately: pos_cloud
  # calls the kiosk RPCs, and an engine one git hop from the migrations it is
  # written against is how the two drift. One engine, two apps, no fork.
  #
  # Pinned rather than tracking main so a rebuild months from now produces the
  # same binary (CLAUDE.md §11.8). Bumping is a deliberate edit here, and the
  # POS and KDS repos should be bumped together — they speak the same wire.
  pos_core:
    git:
      url: https://github.com/bej-hooj/timmaeat-app-flutter.git
      path: packages/pos_core
      ref: 91adddf589119f6a435fec700a3de87ea4dffc98
  pos_link:
    git:
      url: https://github.com/bej-hooj/timmaeat-app-flutter.git
      path: packages/pos_link
      ref: 91adddf589119f6a435fec700a3de87ea4dffc98
  pos_link_flutter:
    git:
      url: https://github.com/bej-hooj/timmaeat-app-flutter.git
      path: packages/pos_link_flutter
      ref: 91adddf589119f6a435fec700a3de87ea4dffc98
  pos_cloud:
    git:
      url: https://github.com/bej-hooj/timmaeat-app-flutter.git
      path: packages/pos_cloud
      ref: 91adddf589119f6a435fec700a3de87ea4dffc98

  # The native SQLite pos_core opens. Its own pubspec says this belongs in "the
  # two APPS' pubspecs" — this is one of the two.
  sqlite3_flutter_libs: ^0.5.24

dev_dependencies:
  # The tablet wears the TIMMA logo like the customer app does: same source
  # image, same adaptive-icon background, so the three surfaces are one brand on
  # a home screen (ECOSYSTEM §15.5).
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/branding/
    - assets/audio/
  generate: true

flutter_launcher_icons:
  image_path: "assets/branding/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  # TIMMA brand green behind the adaptive icon foreground (ECOSYSTEM §15.5).
  adaptive_icon_background: "#205A39"
  adaptive_icon_foreground: "assets/branding/app_icon.png"
