name: Kitchen board — Windows build

# Builds the cuisine for the restaurant's Windows PC and attaches the result
# as a downloadable zip.
#
# ⚠ Why this exists: Flutter cannot cross-compile desktop. A Windows build has
# to be produced ON Windows, and putting the Flutter SDK and the Visual Studio
# C++ toolchain on a restaurant's PC is several gigabytes of download before
# anyone can cook. This runner does it instead, and the PC only downloads the
# finished app.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or tag to build
        required: false
        default: main
  push:
    tags:
      - 'cuisine-win-*'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out the kitchen board
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      # ⚠ The `pos_*` packages are git dependencies on the SCHEMA OWNER's
      # repository, which is private. The job's built-in token only reaches
      # THIS repository, so `pub get` would fail on a 404 that reads like a
      # typo.
      #
      # ⚠ A **read-only deploy key on that one repository**, not a personal
      # access token. A PAT carries the owner's whole account; this carries
      # read access to one repo, is revocable on its own, and cannot write.
      #
      # The URL is rewritten rather than edited in `pubspec.yaml`: the pins
      # must stay byte-identical to what a developer resolves locally, or CI
      # would be building something nobody else can reproduce.
      - name: Let pub reach the private package repository
        shell: bash
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.POS_PACKAGES_DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          git config --global url."git@github.com:".insteadOf "https://github.com/"

      # ⚠ The EXACT SDK the Android build and the suite were proven on, not
      # `channel: stable`. A floating channel means CI compiles with whatever
      # Flutter shipped this week: the first run of this workflow drew 3.50.1,
      # which deprecates `package:flutter/material.dart` and failed `analyze`
      # on 14 issues no developer here can see. Worse than the red build is the
      # green one it would have been — a kitchen binary built from a different
      # framework than the tablet it has to pair with.
      #
      # Bump this deliberately, together with the local SDK, never silently.
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze lib

      # The suite is the same one that runs on a developer's machine. A board
      # that fails it has no business reaching a kitchen.
      - name: Test
        run: flutter test

      - name: Build
        run: flutter build windows --release

      - name: Name the build
        shell: bash
        run: |
          echo "STAMP=$(date +%Y%m%d-%H%M)" >> $GITHUB_ENV
          # The version Windows shows in Settings → Apps, taken from the one
          # place a version is declared.
          echo "APPVERSION=$(grep -m1 '^version:' pubspec.yaml \
            | sed 's/version: *//; s/+.*//')" >> $GITHUB_ENV

      # ⚠ An INSTALLER, not a folder to unpack. Owner, 2026-11-23: the kitchen
      # PC needs a desktop shortcut, not a path to remember. A zip also invites
      # the one failure that looks like a broken app — running the .exe from
      # inside it, without its `data\` folder beside it.
      #
      # Inno Setup 6 ships on the `windows-latest` image; the install below is
      # only there for the day it does not.
      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          if (-not (Test-Path $iscc)) { throw "Inno Setup not found at $iscc" }
          & $iscc /DAppVersion=$env:APPVERSION `
            "/DSourceDir=$($PWD.Path)\build\windows\x64\runner\Release" `
            /O"$($PWD.Path)\build\installer" `
            windows\installer\timma-cuisine.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed: $LASTEXITCODE" }
          Get-ChildItem build\installer

      - name: Package
        uses: actions/upload-artifact@v4
        with:
          name: timma-cuisine-setup-${{ env.STAMP }}
          path: build/installer/TIMMA-Cuisine-Setup.exe
          if-no-files-found: error
          retention-days: 30
